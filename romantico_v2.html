    <!-- Estilos inline para el navbar romántico -->
    <style>
        .navbar-romantic .logo-icon { font-size: 1.8rem; color: #d6336c; }
        .navbar-romantic .logo-text { background: linear-gradient(135deg, #d6336c, #ff6b9d) !important; -webkit-background-clip: text !important; -webkit-text-fill-color: transparent !important; background-clip: text !important; }
        .navbar-romantic .nav-romantic { color: #d6336c !important; font-weight: 700 !important; display: inline-flex !important; align-items: center !important; gap: 6px !important; background: linear-gradient(135deg, #d6336c, #ff6b9d) !important; -webkit-background-clip: text !important; -webkit-text-fill-color: transparent !important; background-clip: text !important; text-shadow: 0 0 20px rgba(214,51,108,0.3) !important; transition: 0.3s !important; }
        .navbar-romantic .nav-romantic:hover { transform: scale(1.05) !important; text-shadow: 0 0 30px rgba(214,51,108,0.5) !important; }
        .navbar-romantic .heart-icon { display: inline-block !important; animation: heartBeat 1.2s ease-in-out infinite !important; -webkit-text-fill-color: initial !important; }
        @keyframes heartBeat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.3); } 30% { transform: scale(1); } 45% { transform: scale(1.2); } 60% { transform: scale(1); } }
        .navbar-romantic .nav-clock { color: #d6336c !important; border-color: rgba(214,51,108,0.3) !important; }
        .navbar-romantic .nav-status-dot { background: #d6336c !important; }
        .navbar-romantic .theme-toggle { border-color: rgba(214,51,108,0.3) !important; color: #d6336c !important; }
        .navbar-romantic .theme-toggle:hover { background: rgba(214,51,108,0.1) !important; }
        .navbar-romantic .nav-toggle { color: #d6336c !important; border-color: rgba(214,51,108,0.3) !important; }
        .navbar-romantic .nav-toggle:hover { background: rgba(214,51,108,0.1) !important; }
        @media (max-width:768px) { .navbar-romantic .nav-romantic { font-size: 1.2rem !important; } .navbar-romantic .heart-icon { animation: heartBeatMobile 0.8s ease-in-out infinite !important; } @keyframes heartBeatMobile { 0%,100% { transform: scale(1); } 20% { transform: scale(1.4); } 40% { transform: scale(1); } 60% { transform: scale(1.3); } 80% { transform: scale(1); } } }
    </style>

<body>

    <!-- ===== NAVBAR ===== -->
    <div id="navbar-placeholder"></div>

    <!-- ===== CONTENEDOR PRINCIPAL ROMÁNTICO ===== -->
    <main id="romantic-app"></main>

    <!-- ===== FOOTER ===== -->
    <div id="footer-placeholder"></div>

    <!-- ================================================================ -->
    <!-- SCRIPTS (con lazy loading integrado)                             -->
    <!-- ================================================================ -->

    <!-- 1. Cargar navbar y footer -->
    <script>
        fetch('Whoami/sections/navbar.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('navbar-placeholder').innerHTML = html;
                simplificarNavbar();
                document.dispatchEvent(new Event('navbar-cargado'));
            })
            .catch(err => console.error('Error cargando navbar:', err));

        fetch('Whoami/sections/footer.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('footer-placeholder').innerHTML = html;
            })
            .catch(err => console.error('Error cargando footer:', err));

        function simplificarNavbar() {
            const navMenu = document.getElementById('navMenu');
            if (!navMenu) { setTimeout(simplificarNavbar, 200); return; }
            const nuevoMenu = document.createElement('ul');
            nuevoMenu.id = 'navMenu';
            nuevoMenu.className = 'nav-menu';
            nuevoMenu.setAttribute('role', 'menubar');
            const li = document.createElement('li');
            li.setAttribute('role', 'none');
            const a = document.createElement('a');
            a.setAttribute('href', 'index.html');
            a.setAttribute('role', 'menuitem');
            a.className = 'nav-romantic';
            a.innerHTML = `<span class="heart-icon">❤️</span> Inicio`;
            li.appendChild(a);
            nuevoMenu.appendChild(li);
            navMenu.parentNode.replaceChild(nuevoMenu, navMenu);
            const navbar = document.querySelector('.navbar');
            if (navbar) navbar.classList.add('navbar-romantic');
            console.log('✅ Navbar romántico simplificado');
        }
        document.addEventListener('navbar-cargado', () => setTimeout(simplificarNavbar, 100));
    </script>
