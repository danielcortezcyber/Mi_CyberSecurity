<!DOCTYPE html>
<html lang="es">
<head>

<body>

    <!-- ===== NAVBAR (se carga dinámicamente en este contenedor) ===== -->
    <div id="navbar-placeholder"></div>

    <!-- ===== CONTENEDOR PRINCIPAL (donde se cargan todas las secciones) ===== -->
    <div id="app"></div>

    <!-- ===== MODAL (para tutoriales, comandos, etc.) ===== -->
    <div id="projectModal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal__backdrop" data-close></div>
        <div class="modal__panel">
            <button class="modal__close" data-close aria-label="Cerrar">✕</button>
            <div id="modalContent"></div>
        </div>
    </div>

    <!-- ===== TOAST (notificaciones) ===== -->
    <div id="toast" hidden role="status" aria-live="polite"></div>

    <!-- ================================================================ -->
    <!-- SCRIPTS (orden de carga es importante)                           -->
    <!-- ================================================================ -->

    <!-- 1. Carga de secciones (loader.js) -->
    <script src="Whoami/js/loader.js"></script>

    <!-- 2. Funcionalidades base del sitio -->
    <script src="Whoami/js/navbar.js"></script>
    <script src="Whoami/js/hero.js"></script>
    <script src="Whoami/js/persistencia.js"></script>   <!-- localStorage (favoritos, progreso) -->

    <script src="Whoami/js/theme.js"></script>

    <!-- 6. Estadísticas del sitio (reloj, uptime, última actualización) -->
    <script src="Whoami/js/site-stats.js"></script>

    <!-- 7. Inicialización general -->
    <script src="Whoami/js/main.js"></script>
